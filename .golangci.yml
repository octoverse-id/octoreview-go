version: "2"
run:
  # Lint the integration suite too (integration_test.go builds only with this tag).
  build-tags:
    - integration
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
  exclusions:
    rules:
      # Test transports build fake responses that no request ever opened.
      - path: _test\.go
        linters: [bodyclose]
formatters:
  enable:
    - gofmt
